<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskEarn Admin</title><link rel="stylesheet" href="admin.css"></head>
<body>
<div id="loginView" class="wrap"><div class="brand"><span>✓</span> TaskEarn Admin</div><div class="panel login"><div class="eyebrow">PRIVATE CONTROL CENTER</div><h1>Admin sign in</h1><p>Use the administrator credentials configured for this TaskEarn deployment.</p><form id="adminLogin"><input id="email" type="email" autocomplete="username" value="admin@taskeearn.com" required><input id="password" type="password" autocomplete="current-password" placeholder="Admin password" required><button>Sign in to Admin</button><div id="loginError" class="error"></div></form><a href="/">← Back to TaskEarn</a></div></div>
